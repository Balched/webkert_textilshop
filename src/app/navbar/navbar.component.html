<nav class="navbar">
  <div class="logo">
    <a routerLink="/home" class="logo-link">Premium Textile Shop</a>
  </div>

  <button class="menu-toggle" (click)="menuOpen = !menuOpen">
    <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>

  <ul class="nav-links" [class.open]="menuOpen">
    <li><a routerLink="/home" routerLinkActive="active" class="nav-link">Kezdőlap</a></li>
    <li><a routerLink="/about" routerLinkActive="active" class="nav-link">Rólunk</a></li>
    <li><a routerLink="/shop" routerLinkActive="active" class="nav-link">Vásárlás</a></li>
    <li><a routerLink="/contact" routerLinkActive="active" class="nav-link">Elérhetőségek</a></li>
    <li><a routerLink="/profil" routerLinkActive="active" class="nav-link">Profil</a></li>
    <li *ngIf="!isLoggedIn"><a routerLink="/register" routerLinkActive="active" class="nav-link">Regisztráció</a></li>
    <li *ngIf="!isLoggedIn"><a routerLink="/login" routerLinkActive="active" class="nav-link">Bejelentkezés</a></li>
    <li *ngIf="isLoggedIn">
      <a class="nav-link" (click)="logout()">Kijelentkezés</a>
    </li>

    <li class="cart-icon">
      <button mat-icon-button (click)="toggleCart()" id="kosar">
        <mat-icon>shopping_cart</mat-icon>
        <span class="cart-count" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </button>
    </li>
  </ul>
</nav>

<div *ngIf="cartVisible" class="cart-dropdown" clickOutside (clickOutside)="toggleCart()">
  <h3>Kosár</h3>
  <p><strong>Összesen: {{ totalAmount }} Ft</strong></p>
  <div class="cart-actions" *ngIf="totalAmount > 0">
    <div>
      <button mat-raised-button color="primary" (click)="clearCart()">Kosár ürítése</button>
      <button mat-raised-button color="primary" [routerLink]="'/order'" (click)="toggleCart()">Rendelés leadása</button>
    </div>
  </div>
  <div *ngFor="let item of cartService.getCart()">
    <div class="cart-item">
      <span>{{ item.product.name }} - {{ item.product.price }} Ft</span>
      <span>- {{ item.quantity }} db</span>
      <button mat-icon-button (click)="changeQuantity(item, 'decrease')"><mat-icon>remove</mat-icon></button>
      <button mat-icon-button (click)="changeQuantity(item, 'increase')"><mat-icon>add</mat-icon></button>
      <button mat-icon-button (click)="cartService.removeFromCart(item)"><mat-icon>delete</mat-icon></button>
    </div>
  </div>
  <hr />
</div>

<mat-divider></mat-divider>
