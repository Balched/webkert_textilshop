<nav class="navbar">
  <div class="logo">
    <a routerLink="/home" class="logo-link">Premium Textile Shop</a>
  </div>
  <ul class="nav-links">
    <li><a routerLink="/home" routerLinkActive="active" class="nav-link">Home</a></li>
    <li><a routerLink="/about" routerLinkActive="active" class="nav-link">About</a></li>
    <li><a routerLink="/shop" routerLinkActive="active" class="nav-link">Shop</a></li>
    <li><a routerLink="/contact" routerLinkActive="active" class="nav-link">Contact</a></li>
    
    <!-- Kosár ikon -->
    <li class="cart-icon">
      <button mat-icon-button (click)="toggleCart()">
        <mat-icon>shopping_cart</mat-icon>
        <span class="cart-count" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </button>
    </li>
  </ul>
</nav>

<!-- Kosár lenyíló -->
<div *ngIf="cartVisible" class="cart-dropdown" clickOutside (clickOutside)="toggleCart()">
  <h3>Kosár</h3>
  <div *ngFor="let item of cartService.getCart()">
    <div class="cart-item">
      <span>{{ item.product.name }} - {{ item.product.price }} Ft</span>
      <span>- {{ item.quantity }} db</span>  <!-- Darabszám megjelenítése -->
      
      <!-- Kosárban lévő termékek darabszámának növelése és csökkentése -->
      <button mat-icon-button (click)="changeQuantity(item, 'decrease')">
        <mat-icon>remove</mat-icon>
      </button>
      <button mat-icon-button (click)="changeQuantity(item, 'increase')">
        <mat-icon>add</mat-icon>
      </button>
      
      <button mat-icon-button (click)="cartService.removeFromCart(item)">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
  <hr />
  <p><strong>Összesen: {{ totalAmount }} Ft</strong></p>
  <button mat-raised-button color="primary" (click)="clearCart()">Kosár ürítése</button>
  <button mat-raised-button color="primary">Rendelés leadása</button>
</div>
